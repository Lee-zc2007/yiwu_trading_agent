services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      AI_PROVIDER: mock
      DATABASE_URL: sqlite:////app/data/yiwu_demo.db
      FRONTEND_ORIGINS: http://localhost:5173
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    depends_on:
      backend:
        condition: service_healthy

